name: Generate Spider-Man Snake Animation

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates a snake game from a github user contributions graph, outputs a svg animation
      - name: Generate Snake Grid (Spider-Man Suit Palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF4655&color_dots=#161b22,#0d419d,#007acc,#e23636,#ff4655
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF4655&color_dots=#161b22,#0d419d,#007acc,#e23636,#ff4655
            
      # Push the content of <build_dir> to a branch
      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
